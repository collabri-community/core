name: Validate schemas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linkml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'linkml>=1.8'
      - run: linkml-validate core.yaml
      - run: linkml-validate security.yaml
